<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1426"/>

  <!-- Subtle gold geometric accent top-right -->
  <polygon points="1200,0 1200,220 980,0" fill="#C8A054" opacity="0.12"/>
  <polygon points="1200,0 1200,100 1100,0" fill="#C8A054" opacity="0.18"/>

  <!-- Subtle gold geometric accent bottom-left -->
  <polygon points="0,630 220,630 0,410" fill="#C8A054" opacity="0.10"/>

  <!-- Gold accent line -->
  <rect x="80" y="295" width="60" height="3" fill="#C8A054"/>

  <!-- FA mark -->
  <rect x="80" y="160" width="72" height="72" rx="6" fill="#C8A054"/>
  <text x="116" y="212" font-family="Georgia, serif" font-weight="700" font-size="36" fill="#0B1426" text-anchor="middle">FA</text>

  <!-- Brand name -->
  <text x="168" y="200" font-family="Georgia, serif" font-weight="400" font-size="38" fill="#FFFFFF" letter-spacing="1">Fin<tspan font-weight="700">Accord</tspan> Advisory</text>

  <!-- Tagline -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-weight="300" font-size="22" fill="#C8A054" letter-spacing="2">FRACTIONAL FINANCE DIRECTOR FOR AFRICA</text>

  <!-- Value proposition -->
  <text x="80" y="390" font-family="Georgia, serif" font-weight="400" font-size="32" fill="#FFFFFF">Board-ready financial intelligence.</text>
  <text x="80" y="436" font-family="Georgia, serif" font-style="italic" font-weight="400" font-size="32" fill="#D4B36E">Without the full-time cost.</text>

  <!-- Trust line -->
  <text x="80" y="510" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="rgba(255,255,255,0.55)">Trusted by 50+ businesses across 5 African markets</text>

  <!-- URL -->
  <text x="80" y="575" font-family="Arial, sans-serif" font-weight="400" font-size="17" fill="rgba(200,160,84,0.7)" letter-spacing="0.5">finaccord.workmaster.uk</text>
</svg>
