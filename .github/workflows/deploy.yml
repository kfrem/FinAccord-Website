name: Deploy to Hostinger
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy via SSH (port 65002)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PASS: ${{ secrets.HOSTINGER_PASS }}
        run: |
          echo "$PASS" > /tmp/pass.txt
          chmod 600 /tmp/pass.txt
          sshpass -f /tmp/pass.txt rsync -avz --delete -e "ssh -p $PORT -o StrictHostKeyChecking=no" ./ "$USER@$HOST:/home/$USER/domains/kashiskin.com/public_html/finaccord/"
          rm /tmp/pass.txt
