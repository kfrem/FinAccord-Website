name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy to finaccord.workmaster.uk
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          echo "$PASS" > /tmp/pass.txt
          chmod 600 /tmp/pass.txt
          sshpass -f /tmp/pass.txt rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='deploy-webhook.php' \
            --exclude='deploy.log' \
            -e "ssh -p $PORT -o StrictHostKeyChecking=no" \
            ./ "u609349519@$HOST:/home/u609349519/domains/workmaster.uk/public_html/finaccord/"
          rm /tmp/pass.txt
